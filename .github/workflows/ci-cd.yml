# VEL Trading Platform - CI/CD Pipeline
# Comprehensive build, test, security scan, and deploy workflow

name: VEL CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  AWS_REGION: us-east-1

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Code Quality and Linting
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install black pylint mypy bandit

      - name: Run Black (code formatter check)
        run: black --check --diff .
        continue-on-error: true

      - name: Run Pylint
        run: |
          pylint --rcfile=.pylintrc *.py runtime/*.py || true
        continue-on-error: true

      - name: Run Bandit (security linter)
        run: |
          bandit -r . -x ./tests,./frontend -f json -o bandit-report.json || true
          bandit -r . -x ./tests,./frontend -ll
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # Unit and Integration Tests
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: veltest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: veltest
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python -m pytest tests/ -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            htmlcov/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ═══════════════════════════════════════════════════════════════════════════
  # Security Scanning
  # ═══════════════════════════════════════════════════════════════════════════
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format json --output pip-audit.json || true
          pip-audit -r requirements.txt || true

      - name: Run Safety check
        run: |
          pip install safety
          safety check -r requirements.txt --json --output safety-report.json || true
          safety check -r requirements.txt || true
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Run Gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            pip-audit.json
            safety-report.json
            trivy-results.sarif
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # SBOM Generation
  # ═══════════════════════════════════════════════════════════════════════════
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════
  # Build Docker Image
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.ECR_REGISTRY }}/vel-trading
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/vel-image.tar

      - name: Run Trivy on container image
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/vel-image.tar
          format: 'sarif'
          output: 'trivy-image.sarif'
        continue-on-error: true

      - name: Upload container scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image.sarif'
        continue-on-error: true

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/vel-image.tar
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # Deploy to Staging
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, sbom]
    if: github.ref == 'refs/heads/develop' || github.event.inputs.deploy_env == 'staging'
    environment:
      name: staging
      url: https://staging.kessann.bot
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker load -i /tmp/vel-image.tar
          docker tag vel-trading:latest $ECR_REGISTRY/vel-trading:$IMAGE_TAG
          docker tag vel-trading:latest $ECR_REGISTRY/vel-trading:staging
          docker push $ECR_REGISTRY/vel-trading:$IMAGE_TAG
          docker push $ECR_REGISTRY/vel-trading:staging

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name vel-staging --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS with Helm
        run: |
          helm upgrade --install vel-trading ./aws/helm/vel \
            --namespace vel-system \
            --create-namespace \
            --set image.repository=${{ steps.login-ecr.outputs.registry }}/vel-trading \
            --set image.tag=${{ github.sha }} \
            --set global.environment=staging \
            --wait --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/vel-trading -n vel-system --timeout=300s
          kubectl get pods -n vel-system -l app=vel-trading

  # ═══════════════════════════════════════════════════════════════════════════
  # Deploy to Production
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, sbom]
    if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_env == 'production'
    environment:
      name: production
      url: https://kessann.bot
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker load -i /tmp/vel-image.tar
          docker tag vel-trading:latest $ECR_REGISTRY/vel-trading:$IMAGE_TAG
          docker tag vel-trading:latest $ECR_REGISTRY/vel-trading:production
          docker push $ECR_REGISTRY/vel-trading:$IMAGE_TAG
          docker push $ECR_REGISTRY/vel-trading:production

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name vel-prod --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS with Helm
        run: |
          helm upgrade --install vel-trading ./aws/helm/vel \
            --namespace vel-system \
            --create-namespace \
            --set image.repository=${{ steps.login-ecr.outputs.registry }}/vel-trading \
            --set image.tag=${{ github.sha }} \
            --set global.environment=production \
            --set autoscaling.minReplicas=6 \
            --set autoscaling.maxReplicas=24 \
            --wait --timeout 15m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/vel-trading -n vel-system --timeout=600s
          kubectl get pods -n vel-system -l app=vel-trading

      - name: Run smoke tests
        run: |
          # Wait for service to be ready
          sleep 30
          # Health check
          curl -sf https://kessann.bot/health || exit 1
          echo "Production deployment verified"
