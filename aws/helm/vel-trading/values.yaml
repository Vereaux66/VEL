# VEL Trading Platform Helm Values
# Default configuration for production deployment

# ============================================================================
# Image Configuration
# ============================================================================
image:
  repository: "" # Set via deployment script
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ============================================================================
# Service Configuration
# ============================================================================
service:
  type: ClusterIP
  port: 5000
  healthPort: 8080
  annotations: {}

# ============================================================================
# Deployment Configuration  
# ============================================================================
replicaCount: 3

deployment:
  id: ""  # Set via deployment script

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# ============================================================================
# Resource Limits
# ============================================================================
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# ============================================================================
# Autoscaling
# ============================================================================
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ============================================================================
# Health Probes
# ============================================================================
livenessProbe:
  httpGet:
    path: /healthz
    port: health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: health
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# ============================================================================
# Ingress
# ============================================================================
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  hosts:
    - host: api.vel.trading
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: vel-tls
      hosts:
        - api.vel.trading

# ============================================================================
# Environment Configuration
# ============================================================================
environment: "production"

env:
  - name: VEL_ENVIRONMENT
    value: "production"
  - name: VEL_LOG_LEVEL
    value: "INFO"
  - name: VEL_LOG_JSON
    value: "true"
  - name: VEL_HEALTH_PORT
    value: "8080"
  - name: OTEL_ENABLED
    value: "true"
  - name: OTEL_EXPORTER_TYPE
    value: "otlp"

# Secrets from AWS Secrets Manager
envFrom:
  - secretRef:
      name: vel-app-secrets

# ============================================================================
# Volume Mounts
# ============================================================================
volumeMounts:
  - name: data
    mountPath: /app/data
  - name: logs
    mountPath: /app/logs
  - name: tmp
    mountPath: /tmp

volumes:
  - name: data
    emptyDir: {}
  - name: logs
    emptyDir: {}
  - name: tmp
    emptyDir: {}

# ============================================================================
# Service Account
# ============================================================================
serviceAccount:
  create: true
  name: vel-api
  annotations:
    eks.amazonaws.com/role-arn: ""  # Set to IRSA role ARN

# ============================================================================
# Pod Disruption Budget
# ============================================================================
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# ============================================================================
# Node Selection
# ============================================================================
nodeSelector:
  workload: vel-trading

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - vel-api
          topologyKey: kubernetes.io/hostname

# ============================================================================
# Topology Spread
# ============================================================================
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: vel-api
