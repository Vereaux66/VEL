# VEL Trading Platform - Helm Values
# Default configuration for VEL Kubernetes deployment

replicaCount: 6

global:
  domain: kessann.bot

image:
  repository: your-ecr-repo/vel
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
  hosts:
    - host: kessann.bot
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 256m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 6
  maxReplicas: 24
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Custom metrics for trading-specific autoscaling
  customMetrics: []
  #  - name: vel_queue_depth
  #    targetAverageValue: "100"
  #  - name: vel_execution_latency_seconds
  #    targetAverageValue: "500m"

# Pod Disruption Budget - ensures high availability during updates
podDisruptionBudget:
  enabled: true
  minAvailable: "50%"
  # Alternative: maxUnavailable: 1

# Prometheus ServiceMonitor for metrics scraping
monitoring:
  enabled: true
  scrapeInterval: "30s"
  scrapeTimeout: "10s"
  labels: {}
  #  release: prometheus

# VEL Backend Environment Configuration
# IMPORTANT: Set these values in production via --set or values override file
# Do NOT deploy with empty values - auto-generated secrets are not persisted
velConfig:
  flaskSecretKey: ""      # Required: Set via --set velConfig.flaskSecretKey=<value>
  jwtSecretKey: ""        # Required: Set via --set velConfig.jwtSecretKey=<value>
  webPassword: ""         # Required: Min 12 chars, set via --set velConfig.webPassword=<value>
  dbPassword: ""          # Required: Set via --set velConfig.dbPassword=<value>
  corsOrigins: "https://kessann.bot,https://*.kessann.bot"
  redisHost: "vel-redis"
  redisPort: "6379"
  dbHost: "vel-postgres"
  dbPort: "5432"
  dbName: "veltrading"
  dbUser: "veluser"

nodeSelector: {}

tolerations: []

affinity: {}
