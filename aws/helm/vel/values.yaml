# VEL Trading Platform - Helm Values
# Default configuration for VEL Kubernetes deployment

replicaCount: 6

global:
  domain: kessann.bot

image:
  repository: your-ecr-repo/vel
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
  hosts:
    - host: kessann.bot
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 256m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 6
  maxReplicas: 24
  targetCPUUtilizationPercentage: 70

nodeSelector: {}

tolerations: []

affinity: {}
