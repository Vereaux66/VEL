{{/* VEL Trading Platform - Secrets Template */}}
{{- $ctx := . -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: vel-secrets
  labels:
    vel.kessann.bot/app: trading-engine
    vel.kessann.bot/tier: config
type: Opaque
stringData:
  flask-secret-key: {{ $ctx.Values.velConfig.flaskSecretKey | default (randAlphaNum 64) | quote }}
  jwt-secret-key: {{ $ctx.Values.velConfig.jwtSecretKey | default (randAlphaNum 64) | quote }}
  web-password: {{ $ctx.Values.velConfig.webPassword | default (randAlphaNum 24) | quote }}
  db-password: {{ $ctx.Values.velConfig.dbPassword | default (randAlphaNum 32) | quote }}
