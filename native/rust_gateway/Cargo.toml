[package]
name = "vel_gateway"
version = "1.0.0"
edition = "2021"
authors = ["VEL Systems"]
description = "VEL High-Performance Rust Gateway - Rate limiting, intent routing, and API interface"
license = "PROPRIETARY"
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "macros", "signal"] }

# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower = { version = "0.4", features = ["limit", "timeout", "buffer", "load-shed"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "request-id"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# gRPC support
tonic = "0.10"
prost = "0.12"

# Database
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.14"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus = "0.13"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
dashmap = "5.5"
parking_lot = "0.12"
once_cell = "1.19"
bytes = "1.5"
futures = "0.3"

# Configuration
config = "0.13"
dotenvy = "0.15"

# Health checks
tokio-stream = "0.1"

# HTTP client for downstream calls
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Crypto
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1.4"
mockall = "0.12"

[build-dependencies]
tonic-build = "0.10"

[[bin]]
name = "vel_gateway"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
