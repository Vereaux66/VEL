# =============================================================================
# VEL Trading Platform - NGINX Common Configuration
# =============================================================================
# Shared configuration included by both HTTP and HTTPS server blocks

# =============================================================================
# Security Headers
# =============================================================================

# HSTS - HTTP Strict Transport Security (uncomment for HTTPS)
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Content Security Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none';" always;

# Prevent clickjacking
add_header X-Frame-Options "DENY" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# XSS Protection
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# =============================================================================
# General Settings
# =============================================================================

# Client settings
client_max_body_size 10M;
client_body_buffer_size 128k;
client_header_buffer_size 1k;
large_client_header_buffers 4 16k;

# Timeouts
client_body_timeout 60s;
client_header_timeout 60s;
send_timeout 60s;
keepalive_timeout 65;

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/rss+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    image/svg+xml
    image/x-icon
    text/css
    text/plain
    text/x-component
    text/xml;

# =============================================================================
# Connection Limits
# =============================================================================

# Limit connections per IP
limit_conn conn_limit 20;

# =============================================================================
# Locations
# =============================================================================

# Health check endpoint - no rate limiting
location /health {
    proxy_pass http://vel_backend/health;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
    access_log off;
}

# Readiness probe
location /api/readiness {
    proxy_pass http://vel_backend/api/readiness;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
    access_log off;
}

# Prometheus metrics endpoint - no rate limiting, internal only
location /metrics {
    # Restrict to internal networks
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
    
    proxy_pass http://vel_backend/metrics;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

# Login endpoint - strict rate limiting
location /api/login {
    limit_req zone=login_limit burst=3 nodelay;
    limit_req_status 429;
    
    proxy_pass http://vel_backend;
    include /etc/nginx/conf.d/vel-proxy.conf;
}

# Trading endpoints - moderate rate limiting
location /api/trade {
    limit_req zone=trade_limit burst=10 nodelay;
    limit_req_status 429;
    
    proxy_pass http://vel_backend;
    include /etc/nginx/conf.d/vel-proxy.conf;
}

location /api/execute {
    limit_req zone=trade_limit burst=10 nodelay;
    limit_req_status 429;
    
    proxy_pass http://vel_backend;
    include /etc/nginx/conf.d/vel-proxy.conf;
}

# WebSocket endpoint
location /socket.io/ {
    proxy_pass http://vel_websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 3600s;  # 1 hour for long-lived connections
}

# General API endpoints
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;
    
    proxy_pass http://vel_backend;
    include /etc/nginx/conf.d/vel-proxy.conf;
}

# Static files from frontend
location /static/ {
    alias /app/frontend/dist/static/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /assets/ {
    alias /app/frontend/dist/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Frontend SPA
location / {
    root /app/frontend/dist;
    try_files $uri $uri/ /index.html;
    
    # Cache HTML for shorter period
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}

# Block common attack vectors
location ~* \.(aspx|asp|mch|psp|cgi|php|phps|phtml|shtml|jsa)$ {
    return 444;
}

# Block access to hidden files
location ~ /\. {
    deny all;
    return 404;
}

# Block access to backup files
location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
    deny all;
    return 404;
}
