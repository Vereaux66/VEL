# =============================================================================
# VEL Trading Platform - NGINX Production Configuration
# =============================================================================
# 
# Production-ready reverse proxy configuration with:
# - Rate limiting and request throttling
# - Security headers (HSTS, CSP, etc.)
# - DDoS protection
# - Request size limits
# - Timeout configuration
# - Gzip compression
# - SSL/TLS termination ready
#
# Usage:
#   nginx -c /path/to/nginx.conf
#   or include in main nginx.conf: include /path/to/vel/nginx.conf;
# =============================================================================

# Rate limiting zones
# Limits per IP address for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=trade_limit:10m rate=5r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream configuration for Gunicorn workers
upstream vel_backend {
    # Use keepalive connections for better performance
    keepalive 32;
    
    # Load balancing with least connections
    least_conn;
    
    # Backend servers (adjust based on deployment)
    server 127.0.0.1:8080 weight=1 max_fails=3 fail_timeout=30s;
    
    # For multi-container deployment:
    # server vel-web-1:8080 weight=1 max_fails=3 fail_timeout=30s;
    # server vel-web-2:8080 weight=1 max_fails=3 fail_timeout=30s;
}

# WebSocket upstream
upstream vel_websocket {
    ip_hash;  # Sticky sessions for WebSocket
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name kessann.bot *.kessann.bot;
    
    # Redirect HTTP to HTTPS in production
    # Uncomment for production:
    # return 301 https://$server_name$request_uri;
    
    # For development/testing, include the config below
    include /etc/nginx/conf.d/vel-common.conf;
}

